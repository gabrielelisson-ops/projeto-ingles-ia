<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!--
      Regras de segurança do site (CSP): o navegador só carrega código deste próprio
      site e só conversa com este site e com a IA do Google. Se alguém conseguir
      inserir um texto malicioso, ele não roda nem consegue mandar a chave da IA
      para outro lugar. 'wasm-unsafe-eval' é necessário para o banco (sql.js).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Não manda o endereço do site para outros sites (por exemplo, ao abrir o AI Studio). -->
    <meta name="referrer" content="no-referrer" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> Ative o JavaScript para usar o app. </noscript>
    <div id="root"></div>
  </body>
</html>
